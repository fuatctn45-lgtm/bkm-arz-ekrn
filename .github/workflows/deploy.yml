name: GitHub Pages Dağıtımı

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodunu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bağımlılıkları yükle
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Vite uygulamasını derle
        run: npm run build

      - name: GitHub Pages ayarlarını hazırla
        uses: actions/configure-pages@v5

      - name: Derlenen dist klasörünü yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4
